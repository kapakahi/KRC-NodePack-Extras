[project]
name = "krc-nodepack-extras"
description = "Optional KRC nodes built on KRC NodePack: integrations with other custom-node packs (e.g. MiniMax H3 RefMods) and standalone utilities (e.g. the KRC Frame Router). Requires KRC NodePack."
version = "1.0.1"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/kapakahi/KRC-NodePack-Extras"
Documentation = "https://github.com/kapakahi/KRC-NodePack-Extras#readme"
"Bug Tracker" = "https://github.com/kapakahi/KRC-NodePack-Extras/issues"

[tool.comfy]
PublisherId = "krc"
DisplayName = "KRC NodePack Extras"
Icon = "https://raw.githubusercontent.com/kapakahi/KRC-NodePack/main/icon.svg"
